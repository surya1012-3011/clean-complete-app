function t(k) { return (i18n[currentLanguage] && i18n[currentLanguage][k]) || (i18n['en'][k] || k); }

function loadSavedData() {
try {
const p = localStorage.getItem('cc_full_p'); if (p) societyProfile = JSON.parse(p);
const b = localStorage.getItem('cc_full_b'); if (b) buildings = JSON.parse(b);
const r = localStorage.getItem('cc_full_r'); if (r) residentsList = JSON.parse(r);
const s = localStorage.getItem('cc_full_s'); if (s) staffList = JSON.parse(s);
const sup = localStorage.getItem('cc_full_sup'); if (sup) supervisorsList = JSON.parse(sup);
const c = localStorage.getItem('cc_full_c'); if (c) complaints = JSON.parse(c);
const l = localStorage.getItem('cc_full_l'); if (l) currentLanguage = l;
} catch (e) { console.error("Storage load error", e); }
}

function saveData() {
localStorage.setItem('cc_full_p', JSON.stringify(societyProfile));
localStorage.setItem('cc_full_b', JSON.stringify(buildings));
localStorage.setItem('cc_full_r', JSON.stringify(residentsList));
localStorage.setItem('cc_full_s', JSON.stringify(staffList));
localStorage.setItem('cc_full_sup', JSON.stringify(supervisorsList));
localStorage.setItem('cc_full_c', JSON.stringify(complaints));
localStorage.setItem('cc_full_l', currentLanguage);
}

function toggleLanguage() {
currentLanguage = (currentLanguage === 'en') ? 'hi' : 'en';
saveData();
updateTopBranding();
renderApp();
showToast(currentLanguage === 'hi' ? "हिंदी भाषा चुनी गई" : "Switched to English");
}

function switchRole(role) {
currentRole = role;
document.getElementById('roleSelector').value = role;
updateRibbon();
renderApp();
}

function updateTopBranding() {
document.getElementById('desktopComplexName').textContent = societyProfile.name;
document.getElementById('topNavComplexName').textContent = societyProfile.shortName || societyProfile.name;
document.getElementById('topNavSubtext').textContent = `${societyProfile.city.split(',')[0]} • ${buildings.length} Towers • ${residentsList.length} Residents`;
const btn = document.getElementById('langBtnText');
if (btn) btn.textContent = currentLanguage === 'en' ? 'हिंदी' : 'English';
const q = document.getElementById('quickLangBadge');
if (q) q.textContent = currentLanguage === 'en' ? 'EN | हिंदी' : 'हिंदी | EN';
}

function updateRibbon() {
const ribbon = document.getElementById('personaLabel');
const badge = document.getElementById('societyLocationBadge');

if (currentRole === 'resident') {
const curRes = residentsList.find(r => r.id === currentResidentId) || residentsList[0];
ribbon.innerHTML = `<span class="font-bold text-blue-900">${curRes ? curRes.name + ' (' + curRes.wing + '-' + curRes.flatNo + ')' : 'Resident'}</span> • Flr ${curRes ? curRes.floor : ''}`;
badge.textContent = "Flat Portal"; badge.className = "bg-blue-200 text-blue-900 px-2 py-0.5 rounded text-[10px] font-bold";
} else if (currentRole === 'staff') {
const curStf = staffList.find(s => s.id === currentStaffId) || staffList[0];
ribbon.innerHTML = `<span class="font-bold text-emerald-900">${curStf ? curStf.name + ' (' + curStf.id + ')' : 'Staff'}</span> • Field Staff`;
badge.textContent = "Housekeeping"; badge.className = "bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded text-[10px] font-bold";
} else if (currentRole === 'supervisor') {
const curSup = supervisorsList.find(s => s.id === currentSupervisorId) || supervisorsList[0];
ribbon.innerHTML = `<span class="font-bold text-amber-900">${curSup ? curSup.name : 'Supervisor'}</span> • In-Charge`;
badge.textContent = "Supervision"; badge.className = "bg-amber-200 text-amber-900 px-2 py-0.5 rounded text-[10px] font-bold";
} else if (currentRole === 'secretary') {
ribbon.innerHTML = `<span class="font-bold text-purple-900">${societyProfile.secretaryName}</span> • Secretary`;
badge.textContent = "Secretary"; badge.className = "bg-purple-200 text-purple-900 px-2 py-0.5 rounded text-[10px] font-bold";
} else {
ribbon.innerHTML = `<span class="font-bold text-slate-900">Facility Super Admin</span> • Master Config`;
badge.textContent = "Admin"; badge.className = "bg-slate-300 text-slate-900 px-2 py-0.5 rounded text-[10px] font-bold";
}
}

function openTowerModal(towerId = null) {
const isEdit = towerId !== null;
const tower = isEdit ? buildings.find(b => b.id === towerId) : {
id: "bld-" + Date.now(),
name: "",
floors: 14,
wings: 1,
flatsPerWing: 4,
ducts: 1,
lifts: 2,
staircases: 2,
lobby: "Standard Finished Lobby",

};

const modal = document.getElementById('globalModal');
document.getElementById('modalTitle').textContent = isEdit ? t('editBuilding') : t('addBuilding');

document.getElementById('modalBody').innerHTML = `
<form onsubmit="handleSaveTower(event, '${tower.id}', ${isEdit})" class="space-y-2.5 text-xs">
<div>
<label class="block font-semibold mb-1 text-slate-700">Tower / Block Name *</label>
<input type="text" id="twName" required value="${tower.name}" placeholder="e.g., Tower E (Carnation)" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>

<div class="grid grid-cols-3 gap-2">
<div>
<label class="block font-semibold mb-1 text-slate-700">${t('floors')} *</label>
<input type="number" id="twFloors" required min="1" max="99" value="${tower.floors}" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>
<div>
<label class="block font-semibold mb-1 text-slate-700">${t('wings')} *</label>
<input type="number" id="twWings" required min="1" max="10" value="${tower.wings || 1}" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>
<div>
<label class="block font-semibold mb-1 text-slate-700">${t('flatsPerWing')} *</label>
<input type="number" id="twFlatsPerWing" required min="1" max="20" value="${tower.flatsPerWing || 4}" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>
</div>

<div class="grid grid-cols-3 gap-2">
<div>
<label class="block font-semibold mb-1 text-slate-700">${t('lifts')} *</label>
<input type="number" id="twLifts" required min="1" max="20" value="${tower.lifts}" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>
<div>
<label class="block font-semibold mb-1 text-slate-700">${t('ducts')} *</label>
<input type="number" id="twDucts" required min="0" max="20" value="${tower.ducts}" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>
<div>
<label class="block font-semibold mb-1 text-slate-700">${t('staircases')} *</label>
<input type="number" id="twStairs" required min="1" max="10" value="${tower.staircases}" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>
</div>

<div>
<label class="block font-semibold mb-1 text-slate-700">${t('lobby')}</label>
<input type="text" id="twLobby" value="${tower.lobby}" placeholder="e.g., Double Height AC Lobby" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>

<div>
<label class="block font-semibold mb-1 text-slate-700">${t('clubHouse')}</label>
<input type="text" id="twClub" value="${tower.clubHouse}" placeholder="e.g., Table Tennis & Gymnasium" class="w-full p-2 border border-slate-300 rounded-xl" />
</div>

<div class="pt-2 flex gap-2">
<button type="button" onclick="closeModal()" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl">Cancel</button>
<button type="submit" class="w-2/3 bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-xl shadow-sm">
${t('saveTower')}
</button>
</div>
</form>
`;

modal.classList.remove('hidden');
lucide.createIcons();
}

function handleSaveTower(e, towerId, isEdit) {
 e.preventDefault();
 const name = document.getElementById('twName').value.trim();
 const floors = parseInt(document.getElementById('twFloors').value) || 1;
 const wings = parseInt(document.getElementById('twWings').value) || 1;
 const flatsPerWing = parseInt(document.getElementById('twFlatsPerWing').value) || 4;
 const lifts = parseInt(document.getElementById('twLifts').value) || 1;
 const ducts = parseInt(document.getElementById('twDucts').value) || 0;
 const staircases = parseInt(document.getElementById('twStairs').value) || 1;
 const lobby = document.getElementById('twLobby').value.trim() || "Standard Lobby";
 const clubHouse = document.getElementById('twClub').value.trim() || "Common Amenity";

 if (isEdit) {
 const index = buildings.findIndex(b => b.id === towerId);
 if (index !== -1) {
 buildings[index] = { id: towerId, name, floors, wings, flatsPerWing, lifts, ducts, staircases, lobby, clubHouse };
 }
 } else {
 buildings.push({ id: towerId, name, floors, wings, flatsPerWing, lifts, ducts, staircases, lobby, clubHouse });
 }

 saveData();
 closeModal();
 updateTopBranding();
 renderApp();
 showToast(isEdit ? "Tower updated successfully!" : "New tower added to master complex!");
}

function deleteBuilding(towerId) {
if (buildings.length <= 1) {
alert("The complex must have at least 1 tower configured.");
return;
}
if (confirm("Are you sure you want to remove this tower from the master configuration?")) {
buildings = buildings.filter(b => b.id !== towerId);
saveData();
updateTopBranding();
renderApp();
showToast("Tower deleted from master configuration.");
}
}

function handleSaveStaff(e, originalId, isEdit) {
 e.preventDefault();
 const name = document.getElementById('stmName').value.trim();
 const newId = document.getElementById('stmId').value.trim().toUpperCase();
 const phone = document.getElementById('stmPhone').value.trim();
 const role = document.getElementById('stmRole').value.trim();
 const assignedTower = document.getElementById('stmTower').value;

 if (isEdit) {
 const idx = staffList.findIndex(s => s.id === originalId);
 if (idx !== -1) {
 staffList[idx].name = name;
 staffList[idx].id = newId;
 staffList[idx].phone = phone;
 staffList[idx].role = role;
 staffList[idx].assignedTower = assignedTower;
 }
 } else {
 staffList.push({ id: newId, name, phone, role, assignedTower, status: "Present", punchIn: "08:00 AM" });
 }

 saveData();
 closeModal();
 updateRibbon();
 renderApp();
 showToast(isEdit ? "Staff member updated!" : "New cleaner registered!");
}

function deleteStaff(stfId) {
if (staffList.length <= 1) {
alert("At least 1 cleaner must remain active.");
return;
}
if (confirm("Delete this staff member?")) {
staffList = staffList.filter(s => s.id !== stfId);
if (currentStaffId === stfId) currentStaffId = staffList[0].id;
saveData();
updateRibbon();
renderApp();
showToast("Staff record removed.");
}
}

modal.classList.remove('hidden');

}

function handleSaveResident(e, resId, isEdit) {
 e.preventDefault();
 const name = document.getElementById('rmName').value.trim();
 const phone = document.getElementById('rmPhone').value.trim();
 const tower = document.getElementById('rmTower').value;
 const wing = document.getElementById('rmWing').value.trim().toUpperCase();
 const floor = parseInt(document.getElementById('rmFloor').value) || 1;
 const flatNo = document.getElementById('rmFlat').value.trim();

 if (isEdit) {
 const idx = residentsList.findIndex(r => r.id === resId);
 if (idx !== -1) {
 residentsList[idx] = { id: resId, name, phone, tower, wing, floor, flatNo };
 }
 } else {
 residentsList.push({ id: resId, name, phone, tower, wing, floor, flatNo });
 }

 saveData();
 closeModal();
 updateRibbon();
 renderApp();
 showToast(isEdit ? "Resident profile updated!" : "New resident enrolled successfully!");
}

function deleteResident(resId) {
if (residentsList.length <= 1) {
alert("At least 1 resident must be registered.");
return;
}
if (confirm("Delete this resident record?")) {
residentsList = residentsList.filter(r => r.id !== resId);
if (currentResidentId === resId) currentResidentId = residentsList[0].id;
saveData();
updateRibbon();
renderApp();
showToast("Resident deleted.");
}
}

function downloadResidentSampleCSV() {
const sample = `name,flat,floor,tower name,phone number\n` +
`Rajesh Sharma,402,4,Tower A (Orchid),9820011111\n` +
`Anita Deshmukh,804,8,Tower B (Lotus),9820022222\n` +
`Sameer Khan,101,1,Tower C (Tulip),9820033333`;

const blob = new Blob([sample], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement("a");
a.href = url;
a.download = `Residents_Template.csv`;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}

function handleResidentCSVUpload(event) {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(e) {
const lines = e.target.result.split(/\r\n|\n/).filter(l => l.trim().length > 0);
for (let i = 1; i < lines.length; i++) {
const parts = lines[i].split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
if (parts.length >= 2 && parts[0]) {
residentsList.push({
id: "RES-" + Date.now() + "-" + i,
name: parts[0],
flatNo: parts[1] || "101",
floor: parseInt(parts[2]) || 1,
tower: parts[3] || "Tower A (Orchid)",
wing: "A",
phone: parts[4] || "9820000000"
});
}
}
saveData();
renderApp();
showToast("Residents imported from CSV!");
};
reader.readAsText(file);
event.target.value = '';
}

function handleResidentComplaint(e) {

 tower: tower,
 category: cat,
 urgency: urgency,
 desc: desc,
 status: "logged",
 assignedTo: staffList[0] ? staffList[0].name : "Housekeeping Staff",
 loggedAt: "Just now",
 residentPhoto: residentTempPhoto,
 photoProof: null,
 photoTimestamp: null,
 geoTag: null,

 });

 saveData();

}

function viewSingleImage(imgSrc, title) {

function approveProof(ticketId) {
const ticket = complaints.find(c => c.id === ticketId);
if (ticket) {
ticket.status = 'resolved';
saveData();
renderApp();
showToast("Ticket verified and resolved!");
}
}

function rejectProof(ticketId) {
const ticket = complaints.find(c => c.id === ticketId);
if (ticket) {
ticket.status = 'assigned';
ticket.photoProof = null;
saveData();
renderApp();
showToast("Re-clean requested.");
}
}

function changeResident(resId) {
currentResidentId = resId;
updateRibbon();
renderApp();
}

function exportSocietyCSV() {
let csv = `SOCIETY: ${societyProfile.name}\nSECRETARY: ${societyProfile.secretaryName}\n\nTicket ID,Resident,Category,Urgency,Status\n`;
complaints.forEach(c => { csv += `"${c.id}","${c.flat}","${c.category}","${c.urgency}","${c.status}"\n`; });
const blob = new Blob([csv], { type: 'text/csv' });
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = `Society_Report.csv`;
a.click();
}

function closeModal() { document.getElementById('globalModal').classList.add('hidden'); }
function showToast(msg) {
const toast = document.getElementById('toastNotification');
document.getElementById('toastMessage').textContent = msg;
toast.classList.remove('opacity-0', 'translate-y-3');
setTimeout(() => toast.classList.add('opacity-0', 'translate-y-3'), 2500);
}
function togglePhoneFrame() { document.getElementById('mainContainer').classList.toggle('phone-container'); }

function renderApp() {
const c = document.getElementById('contentArea');
if (currentRole === 'resident') c.innerHTML = renderResidentView();
else if (currentRole === 'staff') c.innerHTML = renderStaffView();
else if (currentRole === 'supervisor') c.innerHTML = renderSupervisorView();
else if (currentRole === 'secretary') c.innerHTML = renderSecretaryView();
else c.innerHTML = renderAdminView();
renderBottomNav();
lucide.createIcons();
}

function updateClock() {
const clk = document.getElementById('androidClock');
if (clk) clk.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

window.addEventListener('DOMContentLoaded', () => {
loadSavedData();
updateTopBranding();
updateRibbon();
renderApp();
updateClock();
setInterval(updateClock, 10000);
});
